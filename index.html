<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML File Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
        }
        
        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
        }
        
        input[type="file"] {
            padding: 5px;
        }
        
        #status {
            margin-top: 10px;
            font-size: 12px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload HTML File</h1>
        <input type="file" id="fileInput" accept=".html,text/html">
        <div id="status"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.name.endsWith('.html') && file.type !== 'text/html') {
                status.textContent = 'Error: Please upload an HTML file';
                status.style.color = 'red';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const blob = new Blob([e.target.result], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                status.textContent = 'Opened in new tab';
                status.style.color = 'green';
            };

            reader.onerror = () => {
                status.textContent = 'Error reading file';
                status.style.color = 'red';
            };

            reader.readAsText(file);
        });
    </script>
</body>
</html>
